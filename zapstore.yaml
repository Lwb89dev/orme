# Everything is stated here, so no metadata is gathered from other sources.
metadata_sources: []

name: Orme
summary: Read the life and writings of Saint Francis of Assisi, offline and private.
description: |
  Orme is an app for reading the life and teachings of Saint Francis of Assisi. You enter through a story set in early thirteenth-century Umbria. The teachings hang from his writings, and the medieval text stays beside the translation.

  The register is adult. The app describes what Francis wrote and how he lived. It does not score the reader, and it does not speak in his voice.

  - **The story.** Five chapters as a wayfarer who is not Francis. Choices stay in a profile on the device.
  - **The writings.** The Testament, the Earlier Rule, the Later Rule, the Letter to the Entire Order, and the Canticle of the Creatures, with the medieval original beside an editorial translation.
  - **The teachings.** Each one names its sources and opens the work it comes from. Discovery is recorded as found, explored, or studied further. There is no score of goodness.
  - **The garden, the choices, and the questions.** A garden that grows with what you have met, situations with no answer to guess, and offline conversations with a mentor who states the limit of the sources.
  - **Life and sources.** Biography, chronology, places, people, and a glossary, each marked with its kind of evidence.
  - **A journal.** Notes stored only on the device and exportable as Markdown.

  Available in Italian, English, Russian, and the official languages of the European Union except Irish and Maltese.

  No account, no network permission, no analytics, no advertising. No quotation of Francis is invented: where a clean public-domain text is missing, the app says so and paraphrases.
license: MIT
